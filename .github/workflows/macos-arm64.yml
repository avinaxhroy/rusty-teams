name: Build macOS arm64

# A dispatch-only job that builds just the Apple-silicon slice of the app and
# uploads it as an artifact — for checking a build without paying for the
# Linux/Windows/release jobs in build.yml. Not part of the release path.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          # Same key as build.yml's macos job: the arm64 slice and toolchain are
          # shared, so a warm cache here also speeds the release build.
          key: build

      # The arm64 slice only: build the binary, then reuse build-macos.sh's
      # .app bundling by pointing the script at a single target. The script
      # lipos whatever slices it finds; building one target yields one slice
      # and the app wraps it directly.
      - name: Build (arm64 slice only)
        run: |
          cd crates/app
          cargo build --release --target aarch64-apple-darwin

      - name: Bundle .app
        run: |
          repoRoot="$PWD"
          binary="$repoRoot/target/aarch64-apple-darwin/release/teams"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$repoRoot/Cargo.toml" | head -1)"
          app="Rusty Teams.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$binary" "$app/Contents/MacOS/teams"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Rusty Teams</string>
              <key>CFBundleDisplayName</key>
              <string>Rusty Teams</string>
              <key>CFBundleIdentifier</key>
              <string>org.rusty-teams.teams</string>
              <key>CFBundleURLTypes</key>
              <array>
                  <dict>
                      <key>CFBundleURLName</key>
                      <string>org.rusty-teams.teams</string>
                      <key>CFBundleURLSchemes</key>
                      <array>
                          <string>msteams</string>
                      </array>
                  </dict>
              </array>
              <key>CFBundleExecutable</key>
              <string>teams</string>
              <key>CFBundleIconFile</key>
              <string>icon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$version</string>
              <key>CFBundleVersion</key>
              <string>$version</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSMicrophoneUsageDescription</key>
              <string>Rusty Teams uses your microphone for calls.</string>
              <key>NSCameraUsageDescription</key>
              <string>Rusty Teams uses your camera for video calls.</string>
              <key>NSScreenCaptureUsageDescription</key>
              <string>Rusty Teams shares your screen in meetings.</string>
          </dict>
          </plist>
          PLIST
          iconset="$(mktemp -d)/teams.iconset"
          mkdir -p "$iconset"
          png="$repoRoot/crates/app/assets/icon/teams-fast-256.png"
          for size in 16 32 64 128 256; do
            sips -z "$size" "$size" "$png" --out "$iconset/icon_${size}x${size}.png" >/dev/null
          done
          cp "$iconset/icon_32x32.png" "$iconset/icon_16x16@2x.png"
          cp "$iconset/icon_64x64.png" "$iconset/icon_32x32@2x.png"
          cp "$iconset/icon_256x256.png" "$iconset/icon_128x128@2x.png"
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/icon.icns"
          codesign --force --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" teams-macos-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: teams-macos-arm64
          path: teams-macos-arm64.zip
